<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C9A24B">
  <meta name="description" content="Cacho · El Dudo Chileno: miente, duda y calza en la mesa con tus amigos.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DUDO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cacho · El Dudo Chileno</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Firebase SDK para web — reemplaza los valores con los de tu proyecto -->
  <!-- Estos scripts son necesarios para Firebase Auth y Firestore en el navegador -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    // La inicialización real la hace Flutter a través de firebase_options.dart
    // Estos imports hacen que el SDK esté disponible globalmente
  </script>

  <script src="yt_bridge.js"></script>
  <!-- Síncrono (sin defer): window.CachoViewport debe existir antes de
       flutter_bootstrap.js (async), que puede ejecutarse antes que un
       script diferido. Solo toca documentElement, no el body. -->
  <script src="app_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
